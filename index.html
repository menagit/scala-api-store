 "Done", "final": "Events are saved together with the change so none are lost, and a background job delivers them, safely handling repeats.", "adr": "Planned", "phase": 1}, {"id": "D1", "cat": "Architecture", "title": "Database conventions", "status": "Done", "final": "Shared table rules: prefix per context, BIGINT keys, public UUID v7 on users and orders, DECIMAL(12,2) money, UTC DATETIME(6), audit columns set by the app, soft delete only on products, lowercase emails enforced by the database, no foreign keys.", "adr": "Planned", "phase": 1}, {"id": "I11", "cat": "Identity & Security", "title": "Identity in-process vs Keycloak", "status": "Done", "final": "Identity runs inside the application behind interfaces, so Keycloak or Cognito can replace it later.", "adr": "Planned", "phase": 2}, {"id": "I12", "cat": "Identity & Security", "title": "Token strategy", "status": "Done", "final": "A short-lived access JWT (about 15 minutes) and a random refresh token that is stored hashed, replaced on every use, and sent in an httpOnly cookie.", "adr": "Planned", "phase": 2}, {"id": "I1", "cat": "Identity & Security", "title": "Immediate sign-out", "status": "Done", "final": "Each user has a token version. Signing out or changing the password raises it, so older tokens stop working.", "adr": "0001", "phase": 2}, {"id": "I2", "cat": "Identity & Security", "title": "CSRF strategy", "status": "Done", "final": "Play's CSRF protection is on. The refresh cookie is httpOnly, `SameSite=Strict`, and limited to the refresh and sign-out paths.", "adr": "0001", "phase": 2}, {"id": "I3", "cat": "Identity & Security", "title": "Password hashing", "status": "Done", "final": "Argon2id with OWASP minimum settings.", "adr": "0001", "phase": 2}, {"id": "I4", "cat": "Identity & Security", "title": "Rate limiting", "status": "Done", "final": "Bucket4j on forgot-password, reset-password and sign-in.", "adr": "0001", "phase": 2}, {"id": "I5", "cat": "Identity & Security", "title": "Custom annotations nlike deletes the row. Likes are built after the first demo; the notification triggers that use them (low stock M3, discounts) wait for M10.", "adr": null, "phase": 4}, {"id": "M6", "cat": "Domain", "title": "Stock reservation timing", "status": "Done", "final": "Stock is taken at checkout, when the order is created PENDING, with the atomic conditional decrement (M9); losing the last unit is a 409 before anything is paid. No expiry job while there are no payments. With payments: a failed payment keeps the order PENDING so the client can retry on the same order; an expiry job cancels unpaid PENDING orders after about 30 minutes; every cancellation returns the stock.", "adr": "Planned", "phase": 5}, {"id": "M7", "cat": "Domain", "title": "When the cart is cleared", "status": "Done", "final": "Now (no payments): the cart is cleared at checkout, in the same transaction that creates the order and takes the stock, after locking the cart row. With payments: clearing moves to payment success, and a client may have only one PENDING order (a second checkout is refused until the first is paid, cancelled or expired).", "adr": null, "phase": 5}, {"id": "M8", "cat": "Domain", "title": "Discount modeling", "status": "Done", "final": "One percentage discount per product, with no start or end date. The discounted price is calculated, never stored.", "adr": "0002", "phase": 3}, {"id": "M9", "cat": "Domain", "title": "Stock concurrency", "status": "Done", "final": "Purchases use the conditional UPDATE ... WHERE stock >= ? and check that exactly one row changed. Manager edits use last write wins (no version column); an update writes only the fields in the request, so it never rewrites stock it did not change.", "adr": "Planned", "phase": 3}, {"id": "M10", "cat": "Domain", "title": "Notification data access", "status": "Pending", "final": null, "adr": null, "phase": 6}, {"id": "M11", "cat": "Domain", "title": "Image processing timing", "status": "Pending", "final": null, "adr": null, "phase": 3}, {"id": "M1", "cat": "Domain", "title": "Number of images per product", "status": "Done", "final": "A product can have 3 or more images. Having 3 is not required.", "adr": null, "phase": 3}, {"id": "M2", "cat": "Domain", "title": "Order state machine", "status": "Done", "final": "Statuses go PENDING → CONFIRMED → SHIPPED → DELIVERED. A PENDING or CONFIRMED order can be cancelled, and every change is timestamped. Amended 2026-10-17: without online payments the system confirms each order at checkout; with payments it confirms when the payment succeeds. Cancelling an order returns its stock. Shipping needs a tracking number and an estimated delivery date.", "adr": "Planned", "phase": 0}, {"id": "M3", "cat": "Domain", "title": "Low-stock alert trigger", "status": "Done", "final": "Only when stock crosses from 3 or more to below 3. Further decreases while stock is below 3 raise nothing.", "adr": null, "phase": 3}, {"id": "M4", "cat": "Domain", "title": "Price change logging", "status": "Done", "final": "Every price or discount change is stored in a price history table, in the same transaction, plus one log line.", "adr": "0002", "phase": 3}, {"id": "M5", "cat": "Domain", "title": "Pagination", "status": "Done", "final": "`LIMIT/OFFSET` with an exact `COUNT(*)`, and an id tiebreaker on every sort.", "adr": "0001", "phase": 3}, {"id": "P1", "cat": "Payments", "title": "Payment intent creation", "status": "Pending", "final": null, "adr": "Planned", "phase": 5}, {"id": "P2", "cat": "Payments", "title": "Webhook handling", "status": "Pending", "final": null, "adr": null, "phase": 5}, {"id": "G1", "cat": "GraphQL", "title": "403 in GraphQL and query limits", "status": "Done", "final": "GraphQL errors reuse AppError.code: each error is {message, extensions: {code, details}}, with the same codes as REST. Errors that do not come from a use case get adapter-only codes in the graphql package: GRAPHQL_PARSE_FAILED, GRAPHQL_VALIDATION_FAILED, QUERY_TOO_COMPLEX. Query limits "task": "Cart in GraphQL (mutations and a my-cart query)", "status": "Done"}]}, {"key": "I", "what": "Order model", "gate": "Decisions M6, M7 and cancel-and-restock", "status": "Done", "label": "Done", "cards": [{"id": "T1.2.5", "task": "Ordering tables (order, order item, status history)", "status": "Done"}, {"id": "T5.1.1", "task": "Order migration and repositories (ordering_order, ordering_order_item, ordering_order_status_history)", "status": "Done"}, {"id": "T5.1.2", "task": "OrderStatus sealed trait and transition rules", "status": "Done"}]}, {"key": "J", "what": "Checkout", "gate": "F, H and I", "status": "In progress", "label": "In progress", "cards": [{"id": "T5.2.1", "task": "Checkout use case (order from cart, atomic stock decrement)", "status": "In progress"}, {"id": "T5.2.2", "task": "Checkout in GraphQL (mutation)", "status": "Backlog"}]}, {"key": "K", "what": "Client orders", "gate": "I", "status": "Not started", "label": "Not started", "cards": [{"id": "T5.3.1", "task": "My orders (paginated, newest first) and order detail", "status": "Backlog"}]}, {"key": "L", "what": "Delivery", "gate": "I and A", "status": "Not started", "label": "Not started", "cards": [{"id": "T5.4.1", "task": "Update delivery status (manager, GraphQL)", "status": "Backlog"}, {"id": "T5.4.2", "task": "Order status email: template and handler", "status": "Backlog"}]}, {"key": "Cut", "what": "Cut line", "gate": "Moved after the first demo if the pace slips", "status": "Cut", "label": "After the demo", "cards": [{"id": "T2.5.3", "task": "Seeded manager account", "status": "Backlog"}, {"id": "T3.2.2", "task": "Update product (REST, manager only) with price history", "status": "Backlog"}, {"id": "T3.3.2", "task": "Filter products by category ID or name", "status": "Backlog"}, {"id": "T3.5.2", "task": "Disable and enable product (GraphQL, manager only)", "status": "Backlog"}, {"id": "T3.5.3", "task": "Soft-delete product (GraphQL, manager only)", "status": "Backlog"}, {"id": "T5.3.2", "task": "Manager orders list with filters (status, date range, client)", "status": "Backlog"}, {"id": "T5.5.1", "task": "Demo flow test and script", "status": "Backlog"}, {"id": "T3.2.4", "task": "Manager product reads (REST): list and detail, includes disabled products", "status": "Backlog"}]}];
var COLS=["Backlog","Ready","In progress","In review","Done"];
var PHASES=[[0,"Design close-out"],[1,"Database foundations + walking skeleton"],[2,"Identity + Notifications foundation"],[3,"Catalog"],[4,"Shopping"],[5,"Ordering + Payments"],[6,"Notifications completion"],[7,"Delivery"],[8,"Extras"]];
var current="all", saved={board:"all",dec:"all",demo:"all"}, openState={}, view="board", dfilter="all";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function testLine(r){
  if(!r.test||r.test.indexOf("None")===0)return "";
  if(r.test.indexOf("Review:")===0)return '<div class="test"><b>Review:</b>'+esc(r.test.slice(7))+'</div>';
  return '<div class="test"><b>Test:</b> '+esc(r.test)+'</div>';
}
function cardHtml(r){
  return '<div class="card"><div class="id">'+esc(r.id)+'</div><div class="t">'+esc(r.task)+'</div>'+
    (r.pr?'<div class="pr">'+esc(r.pr)+'</div>':'')+testLine(r)+'</div>';
}
function code(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")}
function drawStrip(){
  var isDec=(view==="dec");
  var h='<button class="ph" data-p="all" aria-pressed="'+(current==="all")+'"><div class="n">All</div><div class="nm">All phases</div><div class="pg">'+PHASES.length+' phases</div></button>';
  PHASES.forEach(function(p){
    var l=ROWS.filter(function(r){return r.phase===p[0]});
    var d=l.filter(function(r){return r.status==="Done"}).length;
    var dl=DEC.filter(function(r){return r.phase===p[0]});
    var dd=dl.filter(function(r){return r.status==="Done"}).length;
    var btn='<button class="ph" data-p="'+p[0]+'" aria-pressed="'+(current===String(p[0]))+'"><div class="n">Phase '+p[0]+'</div><div class="nm">'+esc(p[1])+'</div>';
    if(isDec){
      if(!dl.length){h+='<div class="ph off"><div class="n">Phase '+p[0]+'</div><div class="nm">'+esc(p[1])+'</div><div class="pg">No decisions</div></div>';return;}
      h+=btn+'<div class="pg">'+dd+' of '+dl.length+' decided</div><div class="mini"><i style="width:'+(dd*100/dl.length)+'%"></i></div></button>';
    }else{
      if(!l.length){h+='<div class="ph off"><div class="n">Phase '+p[0]+'</div><div class="nm">'+esc(p[1])+'</div><div class="pg">Not planned yet</div></div>';return;}
      h+=btn+'<div class="pg">'+d+' of '+l.length+' done</div><div class="mini"><i style="width:'+(d*100/l.length)+'%"></i></div></button>';
    }
  });
  var s=document.getElementById("strip");s.innerHTML=h;
  Array.prototype.forEach.call(s.querySelectorAll("button"),function(b){b.onclick=function(){current=(b.dataset.p===current&&current!=="all")?"all":b.dataset.p;render()}});
}
function drawDec(){
  var list=DEC.filter(function(r){return current==="all"||String(r.phase)===current});
  var shown=list.filter(function(r){return dfilter==="all"||r.status===dfilter});
  var cats=[],g={};
  shown.forEach(function(r){if(!g[r.cat]){g[r.cat]=[];cats.push(r.cat)}g[r.cat].push(r)});
  var all={};list.forEach(function(r){all[r.cat]=(all[r.cat]||[]);all[r.cat].push(r)});
  var f='<div class="filt"><span>Show:</span>'+["all","Done","Pending"].map(function(x){return '<button class="chip" data-f="'+x+'" aria-pressed="'+(dfilter===x)+'">'+(x==="all"?"All":x==="Done"?"Decided":"Pending")+'</button>'}).join("")+'</div>';
  var body=cats.map(function(c){
    var tot=all[c].length,dn=all[c].filter(function(r){return r.status==="Done"}).length;
    var k="d|"+c, isOpen=(k in openState)?openState[k]:false;
    return '<details data-k="'+esc(k)+'"'+(isOpen?' open':'')+'><summary><span>'+esc(c)+'</span><span class="c">'+dn+' of '+tot+' decided</span></summary><div class="dgrid">'+g[c].map(function(r){
      var adr=(r.adr&&/^\d+$/.test(String(r.adr)))?'ADR '+String(r.adr).padStart(4,"0"):(r.adr==="Planned"?"ADR planned":"");
      return '<div class="dcard"><div class="top"><span>'+esc(r.id)+' · Phase '+r.phase+'</span><span class="badge '+r.status+'">'+(r.status==="Done"?"Decided":"Pending")+'</span></div><div class="t">'+esc(r.title)+'</div>'+
        (r.final?'<div class="f">'+code(r.final)+'</div>':'<div class="f" style="color:var(--mute)">To be decided before Phase '+r.phase+' starts.</div>')+
        (adr?'<div class="m">'+adr+'</div>':'')+'</div>';
    }).join("")+'</div></details>';
  }).join("");
  var d=document.getElementById("dec");
  d.innerHTML=f+(cats.length?body:'<div class="empty">Nothing here</div>');
  Array.prototype.forEach.call(d.querySelectorAll(".chip"),function(b){b.onclick=function(){dfilter=b.dataset.f;drawDec()}});
  Array.prototype.forEach.call(d.querySelectorAll("details"),function(x){x.addEventListener("toggle",function(){openState[x.dataset.k]=x.open})});
}
function drawDemo(){
  var main=DEMO.filter(function(p){return p.key!=="Cut"});
  var done=main.filter(function(p){return p.status==="Done"}).length;
  var h='<div class="filt"><span><b>'+done+'</b> of <b>'+main.length+'</b> pull requests done on the path to the first demo. Cards on the cut line move after the demo if time runs short.</span></div><div class="dgrid">';
  h+=DEMO.map(function(p){
    var cls=p.status==="Done"?"Done":(p.status==="In progress"?"Progress":(p.status==="Cut"?"Cut":"Notstarted"));
    var cards=p.cards.map(function(c){return '<div class="m">'+esc(c.id)+' · '+esc(c.task)+' ('+esc(c.status)+')</div>'}).join("");
    return '<div class="dcard"><div class="top"><span>'+(p.key==="Cut"?"Not in the first demo":"PR "+esc(p.key))+'</span><span class="badge '+cls+'">'+esc(p.label)+'</span></div><div class="t">'+esc(p.what)+'</div>'+cards+(p.gate&&p.gate!=="none"?'<div class="m">'+(p.key==="Cut"?"":"Needs: ")+esc(p.gate)+'</div>':'')+'</div>';
  }).join("")+'</div>';
  document.getElementById("demo").innerHTML=h;
}
function render(){
  var list=ROWS.filter(function(r){return current==="all"||String(r.phase)===current});
  var done=list.filter(function(r){return r.status==="Done"}).length;
  var pct=list.length?Math.round(done*100/list.length):0;
  document.getElementById("fill").style.width=pct+"%";
  document.getElementById("stat").innerHTML="<b>"+done+"</b> of <b>"+list.length+"</b> tasks done (<b>"+pct+"%</b>)";
  var dl=DEC.filter(function(r){return current==="all"||String(r.phase)===current});
  var dn=dl.filter(function(r){return r.status==="Done"}).length;
  var dp=dl.length?Math.round(dn*100/dl.length):0;
  document.getElementById("dfill").style.width=dp+"%";
  document.getElementById("dstat").innerHTML="<b>"+dn+"</b> of <b>"+dl.length+"</b> architecture decisions made (<b>"+dp+"%</b>)";
  document.getElementById("cfill").style.width=COV.value+"%";
  document.getElementById("cmin").style.left=COV.min+"%";
  document.getElementById("cstat").innerHTML="<b>"+Math.round(COV.value)+"%</b> test coverage today. We will enforce a minimum of <b>"+COV.min+"%</b>, and the number will move as the code grows.";
  drawStrip();
  drawDemo();
  document.getElementById("strip").style.display=(view==="demo")?"none":"";
  document.getElementById("bt").style.display=(view==="board")?"":"none";
  document.getElementById("bc").style.display=(view==="board")?"":"none";
  document.getElementById("bd").style.display=(view==="dec")?"":"none";
  document.getElementById("tab-b").setAttribute("aria-pressed",view==="board");
  document.getElementById("tab-d").setAttribute("aria-pressed",view==="dec");
  document.getElementById("tab-p").setAttribute("aria-pressed",view==="demo");
  document.getElementById("board").hidden=(view!=="board");
  document.getElementById("dec").hidden=(view!=="dec");
  document.getElementById("demo").hidden=(view!=="demo");
  drawDec();
  document.getElementById("board").innerHTML=COLS.map(function(c){
    var items=list.filter(function(r){return r.status===c});
    var order=[],groups={};
    items.forEach(function(r){if(!groups[r.sub]){groups[r.sub]=[];order.push(r.sub)}groups[r.sub].push(r)});
    var openDefault=items.length<=6;
    var body=order.map(function(sub){
      var k=c+"|"+sub, isOpen=(k in openState)?openState[k]:openDefault;
      return '<details data-k="'+esc(k)+'"'+(isOpen?' open':'')+'><summary><span>'+esc(sub)+'</span><span class="c">'+groups[sub].length+'</span></summary>'+groups[sub].map(cardHtml).join("")+'</details>';
    }).join("");
    if(!list.length)return c==="Backlog"?'<section class="col" style="grid-column:1/-1"><div class="empty">No tasks planned yet for this phase. See the Architecture decisions tab.</div></section>':'';
    return '<section class="col"><h2><span>'+c+'</span><span>'+items.length+'</span></h2>'+(items.length?body:'<div class="empty">Nothing here</div>')+'</section>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("details"),function(d){d.addEventListener("toggle",function(){openState[d.dataset.k]=d.open})});
}
document.getElementById("tab-b").onclick=function(){saved[view]=current;view="board";current=saved.board;render()};
document.getElementById("tab-d").onclick=function(){saved[view]=current;view="dec";current=saved.dec;render()};
document.getElementById("tab-p").onclick=function(){saved[view]=current;view="demo";current=saved.demo;render()};
render();
</script></body></html>
