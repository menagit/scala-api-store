# https://www.playframework.com/documentation/latest/Configuration
play.application.loader = "com.mendev.apistore.AppLoader"
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}
app {
  database {
    host = ${MYSQL_HOST}
    port = ${MYSQL_PORT}
    name = ${MYSQL_DATABASE}
    user = ${MYSQL_USER}
    password = ${MYSQL_PASSWORD}
    pool-size = 10
    pool-size = ${?DB_POOL_SIZE}
  }
  mail {
    host = ${MAIL_HOST}
    port = ${MAIL_PORT}
    user = ${MAIL_USER}
    password = ${MAIL_PASSWORD}
    from = ${MAIL_FROM}
    link-base-url = ${FRONTEND_BASE_URL}
  }
  jwt {
    secret = ${JWT_SECRET}
    access-token-ttl = 15 minutes
    access-token-ttl = ${?JWT_ACCESS_TOKEN_TTL}
    refresh-token-ttl = 30 days
    refresh-token-ttl = ${?JWT_REFRESH_TOKEN_TTL}
  }
  encryption {
    key = ${ENCRYPTION_KEY}
  }
  graphql {
    max-depth = 15
    max-depth = ${?GRAPHQL_MAX_DEPTH}
    max-complexity = 300
    max-complexity = ${?GRAPHQL_MAX_COMPLEXITY}
  }
  cors {
    allowed-origins = ""
    allowed-origins = ${?CORS_ALLOWED_ORIGINS}
  }

  images {
    storage-dir = "uploads"
    storage-dir = ${?IMAGES_STORAGE_DIR}
    base-url = "http://localhost:9000/images"
    base-url = ${?IMAGES_BASE_URL}
    max-file-bytes = 5242880
    max-dimension = 6000
    max-per-product = 10
  }
}

play.mailer {
  host = ${app.mail.host}
  port = ${app.mail.port}
  user = ${app.mail.user}
  password = ${app.mail.password}
}

db.default {
  driver = "com.mysql.cj.jdbc.Driver"
  #url = "jdbc:mysql://"${app.database.host}":"${app.database.port}"/"${app.database.name}
  url = "jdbc:mysql://"${app.database.host}":"${app.database.port}"/"${app.database.name}"?connectionTimeZone=UTC"
  username = ${app.database.user}
  password = ${app.database.password}
  hikaricp.maximumPoolSize = ${app.database.pool-size}
}

db-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = ${app.database.pool-size}
  }
  throughput = 1
}

image-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 2
  }
  throughput = 1
}